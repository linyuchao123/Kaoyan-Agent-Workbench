[project]
name = "kaoyan-agent-workbench-api"
version = "0.8.0"
description = "FastAPI, RAG and LangGraph backend for 研途"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic-settings>=2.10,<3",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "supabase>=2.18,<3",
  "langchain>=1.0,<2",
  "langgraph>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langchain-tavily>=0.2,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pypdf>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
